services:
  # ─── Backend (Express + Prisma) ──────────────────────────────
  - type: web
    name: finance-tracker-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    # NODE_ENV=production makes `npm install` skip devDependencies (where prisma,
    # typescript, @types/node etc. live), so we need --include=dev for the build.
    buildCommand: npm install --include=dev && npm run build && npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false        # set manually in dashboard to Neon connection string
      - key: CLIENT_URL
        sync: false        # set to the Static Site URL after first deploy

  # ─── Frontend (Vite static site) ─────────────────────────────
  - type: web
    name: finance-tracker-web
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false        # set to the API service URL after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
